note: >-
  Braze publishes platform release notes on a dated bi-weekly cadence rather than an API
  version log. There is no separate API changelog: REST changes, dashboard changes and SDK
  releases all land in the same entry, and SDK breaking changes are the only items marked
  as breaking. Recent window only — the live page is the source of truth.
