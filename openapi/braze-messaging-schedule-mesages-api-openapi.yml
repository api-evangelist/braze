openapi: 3.2.0
info:
  title: Braze Messaging > Schedule Mesages API
  description: The Braze and Radar integration allows you to access sophisticated location-based campaign triggers and user profile enrichment with rich, first-party location data.
  version: 1.0.0
servers:
- url: https://rest.iad-01.braze.com
  description: REST endpoint for instance US-01
- url: https://rest.iad-01.braze.com
  description: REST endpoint for instance US-01
- url: https://rest.iad-02.braze.com
  description: REST endpoint for instance US-02
- url: https://rest.iad-03.braze.com
  description: REST endpoint for instance US-03
- url: https://rest.iad-04.braze.com
  description: REST endpoint for instance US-04
- url: https://rest.iad-05.braze.com
  description: REST endpoint for instance US-05
- url: https://rest.iad-06.braze.com
  description: REST endpoint for instance US-06
- url: https://rest.iad-08.braze.com
  description: REST endpoint for instance US-08
- url: https://rest.fra-01.braze.eu
  description: REST endpoint for instance EU-01
- url: https://rest.fra-02.braze.eu
  description: REST endpoint for instance EU-02
security:
- BearerAuth: []
tags:
- name: Messaging > Schedule Mesages
paths:
  /messages/scheduled_broadcasts:
    get:
      tags:
      - Messaging > Schedule Mesages
      summary: List Upcoming Scheduled Campaigns and Canvases
      description: '> Use this endpoint to return a JSON list of information about scheduled campaigns and entry Canvases between now and a designated `end_time` specified in the request.


        To use this endpoint, youll need to generate an API key with the `messages.schedule_broadcasts` permission.


        Daily, recurring messages will only appear once with their next occurrence. Results returned in this endpoint are only for campaigns and Canvases created and scheduled in Braze.


        ### Rate limit


        We apply the default Braze rate limit of 250,000 requests per hour to this endpoint, as documented in API rate limits.


        ## Response


        ``` json

        Content-Type: application/json

        Authorization: Bearer YOUR-REST-API-KEY

        {

        "scheduled_broadcasts": [

        {

        "name" (string) the name of the scheduled boradcast,

        "id" (stings) the Canvas or campaign identifier,

        "type" (string) the broadcast type either Canvas or Campaign,

        "tags" (array) an array of tag names formatted as strings,

        "next_send_time" (string) The next send time formatted in ISO 8601, may also include time zone if not local/intelligent delivery,

        "schedule_type" (string) The schedule type, either local_time_zones, intelligent_delivery or the name of your company''s time zone,

        },

        ]

        }


        ```'
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{api_key}}
      - name: end_time
        in: query
        schema:
          type: string
        description: '(Required) String in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format


          End date of the range to retrieve upcoming scheduled Campaigns and Canvases. This is treated as midnight in UTC time by the API.'
        example: '2018-09-01T00:00:00-04:00'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getMessagesScheduledBroadcasts
      x-operation-id-source: derived
  /messages/schedule/delete:
    post:
      tags:
      - Messaging > Schedule Mesages
      summary: Delete Scheduled Messages
      description: '> Use this endpoint to cancel a message that you previously scheduled before it has been sent.


        To use this endpoint, youll need to generate an API key with the `messages.schedule.delete` permission.


        ### Rate limit


        We apply the default Braze rate limit of 250,000 requests per hour to this endpoint, as documented in API rate limits.


        ### Request parameters


        | Parameter | Required | Data Type | Description |

        | --- | --- | --- | --- |

        | `schedule_id` | Required | String | The schedule_id to delete (obtained from the response to create schedule). |'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                schedule_id: schedule_identifier
              properties:
                schedule_id:
                  type: string
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{api_key}}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: postMessagesScheduleDelete
      x-operation-id-source: derived
  /canvas/trigger/schedule/delete:
    post:
      tags:
      - Messaging > Schedule Mesages
      summary: Delete Scheduled API-Triggered Canvases
      description: '> Use this endpoint to cancel a Canvas message that you previously scheduled via API-triggered before it has been sent.


        To use this endpoint, youll need to generate an API key with the `canvas.trigger.schedule.delete` permission.


        Scheduled messages or triggers that are deleted very close to or during the time they were supposed to be sent will be updated with best efforts, so last-second deletions could be applied to all, some, or none of your targeted users.


        ### Rate limit


        We apply the default Braze rate limit of 250,000 requests per hour to this endpoint, as documented in API rate limits.


        | Parameter | Required | Data Type | Description |

        | --- | --- | --- | --- |

        | `canvas_id` | Required | String | See Canvas identifier. |

        | `schedule_id` | Required | String | The `schedule_id` to delete (obtained from the response to create schedule). |'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                canvas_id: canvas_identifier
                schedule_id: schedule_identifier
              properties:
                canvas_id:
                  type: string
                schedule_id:
                  type: string
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{api_key}}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: postCanvasTriggerScheduleDelete
      x-operation-id-source: derived
  /campaigns/trigger/schedule/delete:
    post:
      tags:
      - Messaging > Schedule Mesages
      summary: Delete Scheduled API Triggered Campaigns
      description: '> The delete schedule endpoint allows you to cancel a message that you previously scheduled API-triggered Canvases before it has been sent.


        To use this endpoint, youll need to generate an API key with the `campaigns.trigger.schedule.delete` permission.


        Scheduled messages or triggers that are deleted very close to or during the time they were supposed to be sent will be updated with best efforts, so last-second deletions could be applied to all, some, or none of your targeted users.


        ### Rate limit


        We apply the default Braze rate limit of 250,000 requests per hour to this endpoint, as documented in API rate limits.


        ### Request parameters


        | Parameter | Required | Data Type | Description |

        | --- | --- | --- | --- |

        | `campaign_id` | Required | String | See campaign identifier. |

        | `schedule_id` | Required | String | The `schedule_id` to delete (obtained from the response to create schedule). |'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                campaign_id: campaign_identifier
                schedule_id: schedule_identifier
              properties:
                campaign_id:
                  type: string
                schedule_id:
                  type: string
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{api_key}}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
