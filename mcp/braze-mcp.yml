deployment:
  mode: remote
  endpoint: https://mcp.braze.com/mcp
  auth: oauth
  verified: probed
  note: >-
    First-party hosted remote MCP server, GA'd in the July 23, 2026 Braze release. No
    install step and no package — an MCP client POSTs to the URL directly. EU customers
    use https://mcp.braze.eu/mcp; Braze documents that either endpoint can reach any
    Braze cluster. No client ID, client secret or API key is configured by the user: the
    client runs a browser OAuth flow against the Braze dashboard.
server:
  name: braze
  transport: http
  url: https://mcp.braze.com/mcp
  regions:
  - region: US
    url: https://mcp.braze.com/mcp
  - region: EU
    url: https://mcp.braze.eu/mcp
