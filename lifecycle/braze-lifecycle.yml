versioning:
  scheme: date-based-releases
  api_versioning: none
  current: n/a
  docs: https://www.braze.com/docs/help/release_notes
  note: >-
    Braze does not version the REST API as a whole — there is no /v1 prefix, no version
    header and no version date. Versioning appears only per-endpoint where a breaking
    change forced a parallel path (/subscription/status/set alongside
    /v2/subscription/status/set; /preference_center/v1/*; /scim/v2/*; /transactional/v1/*).
    The platform itself ships bi-weekly dated releases, and the SDKs are independently
    semver'd, so "the current version of Braze" is a release date, not an API version.
release_cadence:
  frequency: bi-weekly
  format: dated (e.g. "July 23, 2026")
