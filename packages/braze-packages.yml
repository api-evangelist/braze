note: >-
  Braze ships client-side (device/browser) SDKs, not server-side REST clients. Every
  first-party library below is published from the braze-inc GitHub organization. Braze
  publishes NO official server-side SDK for the REST API in any language — the only
  Node client on npm (braze-api) is community-maintained by braze-community and is
  recorded here with official: false.
