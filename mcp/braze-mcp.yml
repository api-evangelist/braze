posture:
  read_only: false
  note: >-
    Braze describes the server as read-first for non-PII analytics, but the published tool
    list includes six write tools (create/update email templates, create/update content
    blocks, create media library asset). No user-data, messaging-send or user-delete tool
    is exposed, so the destructive surface of the REST API is deliberately absent from MCP.
