      x-operation-id-source: derived
  /messages/schedule/create:
    post:
      tags:
      - Messaging > Schedule Mesages
      summary: Create Scheduled Messages
      description: '> Use this endpoint to schedule a campaign, Canvas, or other message to be sent at a designated time (up to 90 days in the future) and provides you with an identifier to reference that message for updates.


        To use this endpoint, youll need to generate an API key with the `messages.schedule.create` permission.


        If you are targeting a segment, a record of your request will be stored in the Developer Console after all scheduled messages have been sent.


        ### Rate limit


        We apply the default Braze rate limit of 250,000 requests per hour to this endpoint, as documented in API rate limits.


        Braze endpoints support batching API requests. A single request to the messaging endpoints can reach any of the following:


        - Up to 50 specific external_ids, each with individual message parameters

        - A segment of any size created in the Braze dashboard, specified by its `segment_id`

        - An ad-hoc audience segment of any size, defined in the request as a Connected Audience object


        ### Request parameters


        | Parameter | Required | Data Type | Description |

        | --- | --- | --- | --- |

        | `broadcast` | Optional | Boolean | See broadcast. This parameter defaults to false (as of August 31, 2017).


        If `recipients` is omitted, `broadcast` must be set to true. However, use caution when setting `broadcast: true`, as unintentionally setting this flag may cause you to send your message to a larger than expected audience. |

        | `external_user_ids` | Optional | Array of strings | See external user identifier. |

        | `user_aliases` | Optional | Array of user alias objects | See user alias object. |

        | `audience` | Optional | Connected audience object | See connected audience. |

        | `segment_id` | Optional | String | See segment identifier. |

        | `campaign_id` | Required | String | See campaign identifier. |

        | `recipients` | Optional | Array of recipients objects | See recipients object. |

        | `send_id` | Optional | String | See send identifier. |

        | `override_messaging_limits` | Optional | Boolean | Ignore global rate limits for campaigns, defaults to false |

        | `recipient_subscription_state` | Optional | String | Use this to send messages to only users who have opted in (`opted_in`), only users who have subscribed or are opted in (`subscribed`) or to all users, including unsubscribed users (`all`).


        Using `all` users is useful for transactional email messaging. Defaults to `subscribed`. |

        | `schedule` | Required | Schedule object | See schedule object |

        | `messages` | Optional | Messaging object | See available messaging objects. |


        ## Response


        ### Example success response


        ``` json

        {

        "dispatch_id": (string) the dispatch identifier,

        "schedule_id": (string) the schedule identifier,

        "message": "success"

        }


        ```'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                broadcast: false
                external_user_ids: external_user_identifiers
                user_aliases:
                  alias_name: example_name
                  alias_label: example_label
                segment_id: segment_identifiers
                audience:
                  AND:
                  - custom_attribute:
                      custom_attribute_name: eye_color
                      comparison: equals
                      value: blue
                  - custom_attribute:
                      custom_attribute_name: favorite_foods
                      comparison: includes_value
                      value: pizza
                  - OR:
                    - custom_attribute:
                        custom_attribute_name: last_purchase_time
                        comparison: less_than_x_days_ago
                        value: 2
                    - push_subscription_status:
                        comparison: is
                        value: opted_in
                  - email_subscription_status:
                      comparison: is_not
                      value: subscribed
                  - last_used_app:
                      comparison: after
                      value: 2019-07-22T13:17:55+0000
                campaign_id: campaign_identifier
                send_id: send_identifier
                override_messaging_limits: false
                recipient_subscription_state: subscribed
                schedule:
                  time: ''
                  in_local_time: true
                  at_optimal_time: true
                messages:
                  apple_push: {}
                  android_push: {}
                  windows_push: {}
                  windows8_push: {}
                  kindle_push: {}
                  web_push: {}
                  email: {}
                  webhook: {}
                  content_card: {}
              properties:
                broadcast:
                  type: boolean
                external_user_ids:
                  type: string
                user_aliases:
                  type: object
                  properties:
                    alias_name:
                      type: string
                    alias_label:
                      type: string
                segment_id:
                  type: string
                audience:
                  type: object
                  properties:
                    AND:
                      type: array
                      items:
                        type: object
                campaign_id:
                  type: string
                send_id:
                  type: string
                override_messaging_limits:
                  type: boolean
                recipient_subscription_state:
                  type: string
                schedule:
                  type: object
                  properties:
                    time:
                      type: string
                    in_local_time:
                      type: boolean
                    at_optimal_time:
                      type: boolean
                messages:
                  type: object
                  properties:
                    apple_push:
                      type: object
                    android_push:
                      type: object
                    windows_push:
                      type: object
                    windows8_push:
                      type: object
                    kindle_push:
                      type: object
                    web_push:
                      type: object
                    email:
                      type: object
                    webhook:
                      type: object
                    content_card:
                      type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: postMessagesScheduleCreate
      x-operation-id-source: derived
  /campaigns/trigger/schedule/create:
    post:
      tags:
      - Messaging > Schedule Mesages
      summary: Schedule API Triggered Campaigns
      description: '> Use this endpoint to send dashboard created campaign messages (up to 90 days in advance) via API-triggered delivery, allowing you to decide what action should trigger the message to be sent.


        To use this endpoint, youll need to generate an API key with the `campaigns.trigger.schedule.create` permission.


        You can pass in `trigger_properties` that will be templated into the message itself.


        Note that to send messages with this endpoint, you must have a Campaign ID, created when you build an API-Triggered Campaign.


        ### Rate limit


        We apply the default Braze rate limit of 250,000 requests per hour to this endpoint, as documented in API rate limits.


        Braze endpoints support batching API requests. A single request to the messaging endpoints can reach any of the following:


        - Up to 50 specific external_ids, each with individual message parameters

        - A segment of any size created in the Braze dashboard, specified by its `segment_id`

        - An ad-hoc audience segment of any size, defined in the request as a Connected Audience object


        ### Request parameters


        | Parameter | Required | Data Type | Description |

        | --- | --- | --- | --- |

        | `campaign_id` | Required | String | See campaign identifier |

        | `send_id` | Optional | String | See send identifier. |

        | `recipients` | Optional | Array of recipient objects | See recipients object. |

        | `audience` | Optional | Connected audience object | See connected audience. |

        | `broadcast` | Optional | Boolean | See broadcast. This parameter defaults to false (as of August 31, 2017).


        If `recipients` is omitted, `broadcast` must be set to true. However, use caution when setting `broadcast: true`, as unintentionally setting this flag may cause you to send your message to a larger than expected audience. |

        | `trigger_properties` | Optional | Object | Personalization key-value pairs for all users in this send. See trigger properties. |

        | `schedule` | Required | Schedule object | See schedule object. |


        ## Response


        ### Example success response


        ``` json

        Content-Type: application/json

        Authorization: Bearer YOUR-API-KEY-HERE

        {

        {

        "dispatch_id": "dispatch_identifier",

        "schedule_id": "schedule_identifier",

        "message": "success"

        }


        ```'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                campaign_id: campaign_identifier
                send_id: send_identifier
                recipients:
                - user_alias: example_alias
                  external_user_id: external_user_identifier
                  trigger_properties: {}
                audience:
                  AND:
                  - custom_attribute:
                      custom_attribute_name: eye_color
                      comparison: equals
                      value: blue
                  - custom_attribute:
                      custom_attribute_name: favorite_foods
                      comparison: includes_value
                      value: pizza
                  - OR:
                    - custom_attribute:
                        custom_attribute_name: last_purchase_time
                        comparison: less_than_x_days_ago
                        value: 2
                    - push_subscription_status:
                        comparison: is
                        value: opted_in
                  - email_subscription_status:
                      comparison: is_not
                      value: subscribed
                  - last_used_app:
                      comparison: after
                      value: 2019-07-22T13:17:55+0000
                broadcast: false
                trigger_properties: {}
                schedule:
                  time: ''
                  in_local_time: false
                  at_optimal_time: false
              properties:
                campaign_id:
                  type: string
                send_id:
                  type: string
                recipients:
                  type: array
                  items:
                    type: object
                    properties:
                      user_alias:
                        type: string
                      external_user_id:
                        type: string
                      trigger_properties:
                        type: object
                audience:
                  type: object
                  properties:
                    AND:
                      type: array
                      items:
                        type: object
                broadcast:
                  type: boolean
                trigger_properties:
                  type: object
                schedule:
                  type: object
                  properties:
                    time:
                      type: string
                    in_local_time:
                      type: boolean
                    at_optimal_time:
                      type: boolean
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer {{api_key}}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: postCampaignsTriggerScheduleCreate
      x-operation-id-source: derived
  /canvas/trigger/schedule/create:
    post:
      tags:
      - Messaging > Schedule Mesages
      summary: Schedule API Triggered Canvases
      description: '> Use this endpoint to schedule Canvas messages (up to 90 days in advance) via API-triggered delivery, allowing you to decide what action should trigger the message to be sent.


        To use this endpoint, youll need to generate an API key with the `canvas.trigger.schedule.create` permission.


        You can pass in `canvas_entry_properties` that will be templated into the messages sent by the first steps of the Canvas.


        Note that to send messages with this endpoint, you must have a Canvas ID created when you build a Canvas.


        ### Rate limit


        We apply the default Braze rate limit of 250,000 requests per hour to this endpoint, as documented in API rate limits.


        Braze endpoints support batching API requests. A single request to the messaging endpoints can reach any of the following:


        - Up to 50 specific external_ids, each with individual message parameters

        - A segment of any size created in the Braze dashboard, specified by its `segment_id`

        - An ad-hoc audience segment of any size, defined in the request as a Connected Audience object


        ### Request parameters


        | Parameter | Required | Data Type | Description |

        | --- | --- | --- | --- |

        | `canvas_id` | Required | String | See Canvas identifier. |

        | `send_id` | Optional | String | See send identifier. |

        | `recipients` | Optional | Array of recipient objects | See recipients object. |

        | `audience` | Optional | Connected audience object | See connected audience. |

        | `broadcast` | Optional | Boolean | See broadcast. This parameter defaults to false (as of August 31, 2017).


        If `recipients` is omitted, `broadcast` must be set to true. However, use caution when setting `broadcast: true`, as unintentionally setting this flag may cause you to send your message to a larger than expected audience. |

        | `trigger_properties` | Optional | Object | Personalization key-value pairs for all users in this send. See trigger properties. |

        | `schedule` | Required | Schedule object | See schedule object. |'
      requestBody:
        content:
          application/json:
            schema:
